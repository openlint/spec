<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- OpenLint org icon: two lines of code, and the linter's wavy underline resolving into a check -->
  <rect width="512" height="512" rx="100" fill="#131312"/>
  <!-- code lines -->
  <rect x="104" y="128" width="304" height="40" rx="20" fill="#3d3d39"/>
  <rect x="104" y="216" width="192" height="40" rx="20" fill="#3d3d39"/>
  <rect x="320" y="216" width="88" height="40" rx="20" fill="#2a2a27"/>
  <!-- lint squiggle -->
  <path d="M104 352
           q 19 -28 38 0
           q 19 28 38 0
           q 19 -28 38 0
           q 19 28 38 0
           q 19 -28 38 0"
        fill="none" stroke="#4cc294" stroke-width="30" stroke-linecap="round"/>
  <!-- check -->
  <path d="M330 352 L365 390 L424 300"
        fill="none" stroke="#4cc294" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
